context:
  version: "0.11.0"

package:
  name: wild
  version: ${{ version }}

source:
  url: https://github.com/wild-linker/wild/archive/refs/tags/${{ version }}.tar.gz
  sha256: 34d0c66c70b3c4744c548b2b821180d2d578b86eb747cb4a9ed1f4b11a95b337

build:
  number: 0
  skip:
    # Upstream currently only releases on Linux, so skip untested configs.
    - osx
    - win
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path wild
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
      - ln -rs ${{ PREFIX }}/bin/wild ${{ PREFIX }}/bin/ld.wild

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - coreutils

tests:
  - script:
      - wild --version
      - ld.wild --version
  - package_contents:
      bin:
        - wild
        - ld.wild
      strict: true

about:
  homepage: https://github.com/wild-linker/wild
  summary: "Fast linker optimized for incremental builds"
  description: |
    Wild is a linker with the goal of being very fast for iterative development.
    The plan is to eventually make it incremental, however that isn't yet
    implemented. It is however already pretty fast even without incremental
    linking.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  repository: https://github.com/wild-linker/wild

extra:
  recipe-maintainers:
    - benjaminglass1
